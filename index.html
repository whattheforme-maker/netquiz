<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>NetQuiz — CCNA tayyorgarlik</title>
  <style>
    :root{color-scheme:light;--bg:#f4f6fb;--paper:#fff;--ink:#17243a;--muted:#69778d;--line:#e1e6ef;--accent:#4358dc;--accent-soft:#edf0ff;--green:#16784b;--green-soft:#e4f5eb;--red:#b83232;--red-soft:#fff0ef;--gold:#a96b08;--shadow:0 12px 32px rgba(27,39,75,.07);--base:16px}
    :root[data-theme="dark"]{color-scheme:dark;--bg:#101725;--paper:#192337;--ink:#eef2ff;--muted:#a2aec3;--line:#2b3850;--accent:#96a2ff;--accent-soft:#272f55;--green:#6de0a5;--green-soft:#173d32;--red:#ff918b;--red-soft:#492a32;--gold:#f3c16b;--shadow:0 12px 32px rgba(0,0,0,.2)}
    :root[data-theme="sepia"]{color-scheme:light;--bg:#f4eddd;--paper:#fff9eb;--ink:#403524;--muted:#786c58;--line:#e5dac4;--accent:#8a5a32;--accent-soft:#f1e4ce;--green:#346b43;--green-soft:#e6efdc;--red:#a33f32;--red-soft:#f6e5dc;--gold:#986a1f;--shadow:0 12px 30px rgba(89,66,34,.08)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:var(--base)/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .2s,color .2s}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    a{color:inherit}
    .shell{max-width:1180px;margin:auto;padding:20px 24px 64px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}
    .brand{display:flex;gap:11px;align-items:center;font-size:1.15rem;font-weight:850;letter-spacing:-.03em}
    .brand-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--accent);color:white;font-size:1.25rem}
    .brand small{display:block;color:var(--muted);font-size:.72rem;font-weight:600;letter-spacing:0}
    .top-actions,.nav,.actions,.inline{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
    .icon-btn,.btn,.nav-btn,.chip-btn{border:1px solid var(--line);border-radius:11px;background:var(--paper);color:var(--ink);min-height:42px;padding:8px 13px;font-weight:700}
    .icon-btn{min-width:42px;padding:7px}
    .btn.primary{border-color:var(--accent);background:var(--accent);color:#fff}
    :root[data-theme="dark"] .btn.primary{color:#12182b}
    .btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
    .btn.danger{color:var(--red)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .nav{gap:5px;margin-bottom:24px;padding:5px;border:1px solid var(--line);border-radius:14px;background:var(--paper);width:max-content;max-width:100%}
    .nav-btn{min-height:36px;border:0;background:transparent;color:var(--muted);padding:6px 12px}
    .nav-btn.active{background:var(--accent-soft);color:var(--accent)}
    .page{display:grid;gap:18px}
    .hero{position:relative;overflow:hidden;padding:28px;border-radius:22px;background:linear-gradient(120deg,#3549c7,#6475f2);color:white;box-shadow:var(--shadow)}
    .hero:after{content:"";position:absolute;width:270px;height:270px;border:1px solid #ffffff2e;border-radius:50%;right:-65px;top:-135px;box-shadow:0 0 0 35px #ffffff0d,0 0 0 75px #ffffff0a}
    .hero h1{font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.18;margin:5px 0 8px;letter-spacing:-.04em}
    .hero p{margin:0;max-width:600px;color:#e3e7ff}
    .eyebrow{font-size:.76rem;text-transform:uppercase;letter-spacing:.13em;font-weight:800;opacity:.8}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
    .stat,.panel,.section-card,.question-card,.result-card{background:var(--paper);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}
    .stat{padding:16px 18px}.stat b{display:block;font-size:1.5rem;letter-spacing:-.04em}.stat span{color:var(--muted);font-size:.86rem}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:6px 0 0}
    .section-head h2,.panel h2{margin:0;font-size:1.18rem;letter-spacing:-.02em}
    .section-head p{margin:3px 0 0;color:var(--muted);font-size:.9rem}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
    .section-card{padding:17px;display:grid;gap:11px;transition:transform .15s,border .15s}
    .section-card:hover{transform:translateY(-2px);border-color:var(--accent)}
    .section-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
    .section-card h3{margin:0;font-size:1rem;line-height:1.35}
    .section-card p{margin:0;color:var(--muted);font-size:.82rem}
    .pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:.72rem;font-weight:800;padding:4px 9px;white-space:nowrap}
    .pill.done{background:var(--green-soft);color:var(--green)}
    .progress-track{height:7px;border-radius:9px;background:var(--line);overflow:hidden}
    .progress-track i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
    .progress-lines{display:grid;gap:7px}.progress-row{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.75rem}
    .quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
    .quick{padding:18px;background:var(--paper);border:1px solid var(--line);border-radius:17px;text-align:left;color:var(--ink);box-shadow:var(--shadow);display:grid;gap:5px}
    .quick strong{font-size:1rem}.quick span{color:var(--muted);font-size:.83rem}.quick .emoji{font-size:1.35rem}
    .panel{padding:21px}.panel p{color:var(--muted)}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
    .field{display:grid;gap:6px}.field label{font-size:.84rem;font-weight:750}.field small{color:var(--muted)}
    .field input,.field select,.field textarea,.search-input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);color:var(--ink)}
    .field textarea{min-height:150px;resize:vertical;font: .8rem/1.5 ui-monospace,Consolas,monospace}
    .switch-line{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
    .switch-line:last-child{border-bottom:0}.switch-line small{display:block;color:var(--muted)}
    .quiz-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.quiz-head h2{margin:0;font-size:1rem}
    .quiz-track{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:12px}
    .quiz-track i{display:block;height:100%;background:var(--accent);transition:width .2s}
    .question-card{padding:clamp(17px,4vw,30px);display:grid;gap:18px}
    .group-quiz-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;align-items:start;gap:18px;min-width:0}
    .group-quiz-main{display:grid;gap:18px;min-width:0}
    .group-live-panel{position:sticky;top:14px;min-width:0}
    .group-live-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
    .group-live-head h2{margin:0;font-size:1rem}
    .group-live-connection{font-size:.72rem;color:var(--green);white-space:nowrap}
    .group-live-connection.offline{color:var(--red)}
    .group-live-list{display:grid;gap:8px}
    .group-live-row{padding:9px;border:1px solid var(--line);border-radius:11px;background:var(--bg);transition:background .25s,border-color .25s}
    .group-live-row.self{border-color:var(--accent);background:var(--accent-soft)}
    .group-live-row.flash{animation:participant-update 1s ease-out}
    .group-live-name{display:flex;justify-content:space-between;align-items:center;gap:6px;min-width:0;font-size:.84rem;font-weight:800}
    .group-live-name span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .group-live-metrics{display:flex;justify-content:space-between;gap:5px;margin-top:5px;color:var(--muted);font-size:.72rem}
    .group-live-progress{height:4px;margin-top:5px;border-radius:9px;background:var(--line);overflow:hidden}
    .group-live-progress i{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width .25s}
    @keyframes participant-update{0%{background:var(--green-soft);border-color:var(--green)}100%{background:var(--bg);border-color:var(--line)}}
    .q-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.q-id{color:var(--accent);font-weight:850}
    .question-text{margin:0;font-size:clamp(1.15rem,2.5vw,1.45rem);line-height:1.5;font-weight:720;white-space:pre-line}
    .exhibit{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line)}
    pre.code{white-space:pre;overflow:auto;padding:14px;border:1px solid var(--line);border-radius:11px;background:var(--bg);font-size:.85rem}
    .answers{display:grid;gap:9px}.answer{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;min-height:50px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
    .answer:hover:not(:disabled){border-color:var(--accent)}.answer.selected{background:var(--accent-soft);border-color:var(--accent)}
    .answer.ok{background:var(--green-soft);border-color:var(--green)}.answer.no{background:var(--red-soft);border-color:var(--red)}.answer.missed{border-style:dashed;border-color:var(--green)}
    .answer-key{font-weight:850;color:var(--muted);min-width:1.5rem}.answer-text{white-space:pre-wrap;overflow-wrap:anywhere}
    .pair-list{display:grid;gap:10px}.pair-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:12px}
    .pair-row code{overflow-wrap:anywhere}.feedback{padding:12px 14px;border-left:4px solid var(--green);border-radius:9px;background:var(--green-soft)}
    .feedback.wrong{border-color:var(--red);background:var(--red-soft)}.feedback small{display:block;color:var(--muted);margin-top:4px}
    .quiz-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .dots{display:flex;gap:5px;flex-wrap:wrap}.dot{width:11px;height:11px;border:0;border-radius:50%;background:var(--line);padding:0}.dot.answered{background:var(--accent)}.dot.current{outline:2px solid var(--accent);outline-offset:2px}.dot.correct{background:var(--green)}.dot.wrong{background:var(--red)}
    .score-hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.score-big{font-size:2.3rem;font-weight:900;letter-spacing:-.06em}.muted{color:var(--muted)}.good{color:var(--green)}.bad{color:var(--red)}
    .table-wrap{overflow:auto}.review-table{width:100%;border-collapse:collapse;font-size:.86rem}.review-table th,.review-table td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}.review-table th{color:var(--muted)}
    .question-list{display:grid;gap:10px}.question-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
    .question-row p{margin:4px 0;color:var(--muted);font-size:.87rem}
    .toast{position:fixed;z-index:10;bottom:20px;left:50%;transform:translate(-50%,20px);padding:11px 16px;border-radius:12px;background:var(--ink);color:var(--paper);opacity:0;pointer-events:none;transition:.2s;max-width:min(90vw,600px);text-align:center}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .modal-back{position:fixed;z-index:20;inset:0;background:#101729a8;display:grid;place-items:center;padding:18px}
    .modal{width:min(480px,100%);background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:19px;padding:23px;box-shadow:var(--shadow)}
    .modal h2{margin:0 0 8px}.modal p{margin:0 0 16px;color:var(--muted)}
    .notice{padding:12px;border-radius:11px;background:var(--accent-soft);font-size:.88rem}
    .weak-list{display:grid;gap:8px}.weak-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
    .hidden{display:none!important}
    @media(max-width:780px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.quick-grid{grid-template-columns:1fr}}
    @media(max-width:900px){.group-quiz-layout{grid-template-columns:minmax(0,1fr)}.group-live-panel{position:static}.group-live-list{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}}
    @media(max-width:540px){.shell{padding:13px 13px 45px}.topbar{align-items:flex-start}.brand{font-size:1rem}.brand-mark{width:36px;height:36px}.icon-btn{min-width:39px;padding:6px}.nav{width:100%;overflow-x:auto;flex-wrap:nowrap}.nav-btn{white-space:nowrap;padding-inline:10px}.hero{padding:23px 20px}.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.pair-row{grid-template-columns:1fr;gap:5px}.question-row{display:grid}.question-card{padding:17px}.stat{padding:13px}.stat b{font-size:1.3rem}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">N</div><div>NetQuiz<small>CCNA imtihoniga tayyorgarlik</small></div></div>
      <div class="top-actions">
        <button class="icon-btn" id="fontDown" title="Shriftni kichraytirish" aria-label="Shriftni kichraytirish">A−</button>
        <button class="icon-btn" id="fontUp" title="Shriftni kattalashtirish" aria-label="Shriftni kattalashtirish">A+</button>
        <button class="icon-btn" id="themeBtn" title="Ko'rinishni almashtirish" aria-label="Ko'rinishni almashtirish">☀️</button>
      </div>
    </header>
    <nav class="nav" id="nav">
      <button class="nav-btn active" data-page="home">Bosh sahifa</button>
      <button class="nav-btn" data-page="universal">Universal test</button>
      <button class="nav-btn" data-page="mistakes">Xatolar daftari</button>
      <button class="nav-btn" data-page="stars">Saqlanganlar</button>
      <button class="nav-btn" data-page="stats">Statistika</button>
      <button class="nav-btn" data-page="group">Guruh</button>
      <button class="nav-btn" data-page="settings">Sozlamalar</button>
    </nav>
    <main id="app" class="page" aria-live="polite"></main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <input id="importFile" type="file" accept="application/json,.json" class="hidden">
  <script src="questions.js"></script>
  <script src="supabase-config.js"></script>
  <script>
  (function(){
    "use strict";
    const QUESTIONS=window.QUIZ_QUESTIONS||[], IMAGES=window.QUIZ_IMAGES||{};
    const STORE="netquiz-v1", app=document.getElementById("app"), nav=document.getElementById("nav");
    const defaultState={name:"",theme:"auto",font:16,masteryTarget:2,immediate:true,records:{},titles:{},daily:{},history:[]};
    let storageError="";
    let state=loadState(),page="home",session=null,activeSection=0,toastTimer=null;
    let supabaseClient=null,authUid=null,roomCode="",roomChannel=null,roomSnapshot=null,groupStarted=false,supabaseConnectPromise=null,supabaseError="",roomRealtimeStatus="CLOSED",roomPollTimer=null,roomHealthTimer=null,roomRefreshTask=null,roomRefreshQueued=false,roomSubscribeTask=null,participantWriteTimer=null,participantWriteChain=Promise.resolve(),participantFlashIds=new Set(),participantFlashTimers=new Map();
    const html=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    function loadState(){try{const saved=JSON.parse(localStorage.getItem(STORE)||"{}");return Object.assign({},defaultState,saved,{records:saved.records||{},titles:saved.titles||{},daily:saved.daily||{},history:saved.history||[]})}catch(e){storageError="Saqlangan progressni o‘qib bo‘lmadi. Sozlamalardan zaxira faylini import qiling.";return Object.assign({},defaultState)}}
    function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){notify("Saqlash amalga oshmadi. Brauzer xotirasi to'lgan bo'lishi mumkin.")}}
    function notify(s){const t=document.getElementById("toast");t.textContent=s;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),3200)}
    function today(){return new Date().toISOString().slice(0,10)}
    function record(q){return state.records[q.id]||(state.records[q.id]={attempts:0,correct:0,wrong:0,streak:0,mastered:false,starred:false,last:0})}
    const sections=[];for(let i=0;i<QUESTIONS.length;i+=30){const qs=QUESTIONS.slice(i,i+30),freq={};qs.forEach(q=>freq[q.t]=(freq[q.t]||0)+1);const suggestion=Object.keys(freq).sort((a,b)=>freq[b]-freq[a])[0]||"Aralash mavzular";sections.push({number:sections.length+1,questions:qs,title:state.titles[sections.length]||("Bo'lim "+(sections.length+1)+": "+suggestion)})}
    function sectionOf(q){return Math.floor((q.id-1)/30)}
    function pct(n,total){return total?Math.round(n/total*100):0}
    function orderByWeakness(items){const pool=items.slice(),out=[];while(pool.length){let total=pool.reduce((a,q)=>a+1+record(q).wrong,0),r=Math.random()*total,j=0;for(;j<pool.length-1;j++){r-=1+record(pool[j]).wrong;if(r<0)break}out.push(pool.splice(j,1)[0])}return out}
    function applyTheme(){let theme=state.theme;if(theme==="auto")theme=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=theme==="light"?"":theme;document.getElementById("themeBtn").textContent=theme==="dark"?"🌙":theme==="sepia"?"📖":"☀️";document.documentElement.style.setProperty("--base",(state.font||16)+"px")}
    function sectionProgress(s){const rs=s.questions.map(record);return {attempted:rs.filter(r=>r.attempts>0).length,mastered:rs.filter(r=>r.mastered).length,all:s.questions.length}}
    function renderHome(){
      page="home";let mastered=QUESTIONS.filter(q=>record(q).mastered).length,attempted=QUESTIONS.filter(q=>record(q).attempts>0).length,allWrong=QUESTIONS.reduce((a,q)=>a+record(q).wrong,0);
      const sorted=sections.slice().sort((a,b)=>Number(sectionProgress(b).mastered===sectionProgress(b).all)-Number(sectionProgress(a).mastered===sectionProgress(a).all)||a.number-b.number);
      app.innerHTML='<section class="hero"><div class="eyebrow">Salom, '+html(state.name||"do'stim")+' 👋</div><h1>Bilimingizni mustahkamlang.<br>Imtihonga ishonch bilan kiring.</h1><p>Har kuni oz-ozdan mashq qiling — natijangiz va yodlangan savollaringiz shu qurilmada saqlanadi.</p></section>'+
        '<section class="stats"><div class="stat"><b>'+mastered+' / '+QUESTIONS.length+'</b><span>Yodlangan savollar · '+pct(mastered,QUESTIONS.length)+'%</span></div><div class="stat"><b>'+attempted+'</b><span>Yechib ko‘rilgan</span></div><div class="stat"><b>'+allWrong+'</b><span>Jami xato urinishlar</span></div><div class="stat"><b>'+sections.length+'</b><span>30 savollik bo‘lim</span></div></section>'+
        '<section class="quick-grid"><button class="quick" data-go="universal"><span class="emoji">🎲</span><strong>Universal test</strong><span>Barcha bo‘limlardan savollar va zaif joylar tahlili</span></button><button class="quick" data-go="mistakes"><span class="emoji">↻</span><strong>Xatolarni takrorlash</strong><span>'+allWrong+' ta xato urinishni qayta ishlab chiqing</span></button><button class="quick" data-go="group"><span class="emoji">👥</span><strong>Do‘stlar bilan</strong><span>Xona yarating yoki xona kodiga qo‘shiling</span></button></section>'+
        '<div class="section-head"><div><h2>Bo‘limlar</h2><p>Nomlar savollardagi mavzulardan taklif qilindi. Qalam belgisidan tahrirlang.</p></div><span class="muted">'+QUESTIONS.length+' ta savol</span></div><section class="panel"><div class="field"><label for="questionSearch">Savol qidirish</label><input id="questionSearch" class="search-input" type="search" placeholder="Savol yoki mavzu bo‘yicha izlang..."></div><div id="searchResults"></div></section><section class="grid">'+sorted.map(s=>{const p=sectionProgress(s),done=p.mastered===p.all;return '<article class="section-card"><div class="section-top"><div><h3>'+html(s.title)+'</h3><p>'+((s.number-1)*30+1)+'–'+((s.number-1)*30+p.all)+' · '+p.all+' ta savol</p></div><button class="icon-btn" data-edit-title="'+(s.number-1)+'" aria-label="Bo‘lim nomini tahrirlash">✎</button></div><span class="pill '+(done?"done":"")+'">'+(done?"✓ Yodlangan":p.attempted?"● Jarayonda":"○ Boshlanmagan")+'</span><div class="progress-lines"><div class="progress-row"><span>Yechilgan</span><b>'+p.attempted+'/'+p.all+' · '+pct(p.attempted,p.all)+'%</b></div><div class="progress-track"><i style="width:'+pct(p.attempted,p.all)+'%"></i></div><div class="progress-row"><span>Yodlangan</span><b>'+p.mastered+'/'+p.all+' · '+pct(p.mastered,p.all)+'%</b></div><div class="progress-track"><i style="width:'+pct(p.mastered,p.all)+'%;background:var(--green)"></i></div></div><div class="actions"><button class="btn primary" data-start-section="'+(s.number-1)+'">Testni boshlash</button><button class="btn soft" data-review-section="'+(s.number-1)+'">Takrorlash</button></div></article>'}).join("")+'</section>';
      updateNav("home")
    }
    function updateNav(which){nav.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===which))}
    function renderUniversal(){

    function participantMetrics(){

      const answered=session.items.filter(q=>isReady(q));
      return {progress:answered.length,score:answered.filter(q=>isCorrect(q)).length,elapsed:Math.floor((Date.now()-session.started)/1000)}
    }
    function writeParticipant(status){
      if(!supabaseClient||!roomCode||!authUid||!session||!session.group)return Promise.resolve(false);
      const metrics=participantMetrics(),payload={name:state.name,status:status||"solving",...metrics,updated_at:Date.now()},code=roomCode,uid=authUid;
      const write=participantWriteChain.catch(()=>{}).then(async()=>{
        const {error}=await supabaseClient.from("netquiz_participants").update(payload).eq("room_code",code).eq("user_id",uid);
        if(error)throw error
      });
      participantWriteChain=write;
      return write.catch(e=>{notify("Guruhdagi progress yuborilmadi: "+e.message);return false})
    }
    function queueParticipantWrite(){
      if(!session||!session.group||session.finished)return;

    async function flushParticipantSync(status){

        const progress=Math.max(0,Number(p.progress)||0),score=Math.max(0,Number(p.score)||0),percent=progress?Math.round(score/progress*100):null,width=total?Math.min(100,progress/total*100):0;

      }).join(""):'<p class="muted">Ishtirokchilar yuklanmoqda…</p>')+'</div>'
    }
    function updateGroupLivePanel(){

    function markChangedParticipants(next){
      const previous=(roomSnapshot&&roomSnapshot.participants)||{};
      Object.entries(next).forEach(([id,p])=>{
        const old=previous[id];
        if(old&&(old.progress!==p.progress||old.score!==p.score||old.elapsed!==p.elapsed||old.status!==p.status||old.name!==p.name)){
          participantFlashIds.add(id);clearTimeout(participantFlashTimers.get(id));
          participantFlashTimers.set(id,setTimeout(()=>{participantFlashIds.delete(id);participantFlashTimers.delete(id);updateGroupLivePanel()},1100))
        }
      })
    }
    async function refreshRoom(code){
      if(!supabaseClient||roomCode!==code)return false;
      if(roomRefreshTask){roomRefreshQueued=true;await roomRefreshTask;if(roomRefreshQueued){roomRefreshQueued=false;return refreshRoom(code)}return roomCode===code}
      roomRefreshTask=(async()=>{
        const [roomResult,peopleResult]=await Promise.all([
          supabaseClient.from("netquiz_rooms").select("*").eq("code",code).maybeSingle(),
          supabaseClient.from("netquiz_participants").select("*").eq("room_code",code)
        ]);
        if(roomResult.error)throw roomResult.error;
        if(peopleResult.error)throw peopleResult.error;
        if(roomCode!==code)return false;
        if(!roomResult.data){roomCode="";roomSnapshot=null;history.replaceState(null,"",location.pathname);notify("Xona topilmadi yoki o‘chirilgan.");renderGroup();closeRoomRealtime();return false}
        const participants={};(peopleResult.data||[]).forEach(p=>{participants[p.user_id]=p});
        markChangedParticipants(participants);
        roomSnapshot={code:roomResult.data.code,title:roomResult.data.title,owner:roomResult.data.owner_id,ownerName:roomResult.data.owner_name,state:roomResult.data.state,ids:roomResult.data.question_ids||[],createdAt:roomResult.data.created_at,participants};
        updateGroupLivePanel();
        if(page==="group")renderGroup();
        if(roomSnapshot.state==="active"&&!groupStarted){groupStarted=true;if(!session||!session.group||session.finished)launch(roomSnapshot.ids.map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean),{source:"group",group:true,shuffle:false})}
        return true
      })();
      try{return await roomRefreshTask}finally{roomRefreshTask=null}
    }
    function startRoomPolling(code){
      if(roomPollTimer)return;
      roomPollTimer=setInterval(async()=>{
        if(roomCode!==code){clearInterval(roomPollTimer);roomPollTimer=null;return}
        try{await refreshRoom(code)}catch(e){roomRealtimeStatus="ERROR";updateGroupLivePanel()}
        if(roomCode===code&&roomRealtimeStatus!=="SUBSCRIBED")await subscribeRoomRealtime(code,true)
      },7000)
    }
    function monitorRoomRealtime(code,channel){
      clearInterval(roomHealthTimer);
      roomHealthTimer=setInterval(()=>{
        if(roomCode!==code||roomChannel!==channel){clearInterval(roomHealthTimer);roomHealthTimer=null;return}
        const connected=supabaseClient&&supabaseClient.realtime.isConnected()&&channel.state==="joined"&&navigator.onLine;
        if(!connected&&roomRealtimeStatus==="SUBSCRIBED"){
          roomRealtimeStatus="ERROR";updateGroupLivePanel();startRoomPolling(code)
        }
      },7000)
    }
    async function subscribeRoomRealtime(code,reconnect){
      if(!supabaseClient||roomCode!==code)return;
      if(roomSubscribeTask)return roomSubscribeTask;
      if(roomChannel&&(!reconnect||roomRealtimeStatus==="SUBSCRIBED"))return;
      roomSubscribeTask=(async()=>{
        if(roomChannel){const old=roomChannel;roomChannel=null;await supabaseClient.removeChannel(old)}
        if(roomCode!==code)return;
        roomRealtimeStatus="CONNECTING";updateGroupLivePanel();
        const channel=supabaseClient.channel("netquiz-room-"+code)
          .on("postgres_changes",{event:"*",schema:"public",table:"netquiz_rooms",filter:"code=eq."+code},()=>refreshRoom(code).catch(e=>{roomRealtimeStatus="ERROR";updateGroupLivePanel();notify("Xona ma’lumotini yuklab bo‘lmadi: "+e.message)}))
          .on("postgres_changes",{event:"*",schema:"public",table:"netquiz_participants",filter:"room_code=eq."+code},()=>refreshRoom(code).catch(e=>{roomRealtimeStatus="ERROR";updateGroupLivePanel();notify("Ishtirokchilar ro‘yxati yuklanmadi: "+e.message)}))
          .subscribe((status,error)=>{
            if(roomChannel!==channel)return;
            roomRealtimeStatus=status;
            if(status==="SUBSCRIBED"){clearInterval(roomPollTimer);roomPollTimer=null;monitorRoomRealtime(code,channel);refreshRoom(code).catch(e=>notify("Xona yangilanmadi: "+e.message))}
            else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED")startRoomPolling(code);
            updateGroupLivePanel();
            if((status==="CHANNEL_ERROR"||status==="TIMED_OUT")&&error)notify("Realtime uzildi; qayta ulanishga uriniladi: "+error.message)
          });
        roomChannel=channel
      })();
      try{return await roomSubscribeTask}finally{roomSubscribeTask=null}
    }
    async function attachRoom(code){
      if(roomCode!==code)closeRoomRealtime();
      roomCode=code;roomSnapshot=null;groupStarted=false;
      try{
        const {data:participant,error:participantError}=await supabaseClient.from("netquiz_participants").select("user_id").eq("room_code",code).eq("user_id",authUid).maybeSingle();
        if(participantError)throw participantError;
        if(participant){
          const {error:updateError}=await supabaseClient.from("netquiz_participants").update({name:state.name,updated_at:Date.now()}).eq("room_code",code).eq("user_id",authUid);
          if(updateError)throw updateError
        }else{
          const {error:joinError}=await supabaseClient.rpc("join_netquiz_room",{p_room_code:code,p_name:state.name});
          if(joinError)throw joinError
        }
        await subscribeRoomRealtime(code,false);
        return await refreshRoom(code)
      }catch(e){roomCode="";roomSnapshot=null;closeRoomRealtime();history.replaceState(null,"",location.pathname);notify("Xonaga qo‘shilmadi: "+e.message);renderGroup();return false}
    }
    async function connectSupabase(config){
      if(!config||!config.url||!config.publishableKey)throw new Error("supabase-config.js faylida url va publishableKey qiymatlari bo‘lishi kerak.");
      if(supabaseConnectPromise)return supabaseConnectPromise;
      supabaseConnectPromise=(async()=>{
        const {createClient}=await import("https://esm.sh/@supabase/supabase-js@2");
        supabaseClient=createClient(config.url,config.publishableKey);
        const {data,error}=await supabaseClient.auth.getSession();
        if(error)throw error;
        if(!data.session){const result=await supabaseClient.auth.signInAnonymously();if(result.error)throw result.error;authUid=result.data.user.id}
        else authUid=data.session.user.id;
        return true
      })();
      try{const connected=await supabaseConnectPromise;supabaseError="";return connected}catch(e){supabaseClient=null;authUid=null;supabaseError=/anonymous sign-ins are disabled/i.test(e.message)?"Supabase Dashboard’da Authentication → Sign In / Providers’dan Anonymous sign-ins’ni yoqing.":e.message;throw e}finally{supabaseConnectPromise=null}
    }
    function selectGroupQuestions(){

    }

      if(b.id==="createRoom"){await createRoom();return}
      if(b.id==="connectSupabase"){try{await connectSupabase(window.NETQUIZ_SUPABASE_CONFIG);renderGroup();autoJoinRoom()}catch(err){notify("Supabase’ga ulanilmadi: "+err.message);renderGroup()}return}
      if(b.id==="joinRoom"){joinRoom(document.getElementById("groupCode").value);return}
      if(b.id==="leaveRoom"){leaveRoom();return}
      if(b.id==="startGroup"){try{const {error}=await supabaseClient.from("netquiz_rooms").update({state:"active"}).eq("code",roomCode);if(error)throw error}catch(err){notify("Testni boshlashda xato: "+err.message)}return}
      if(b.id==="enterGroupTest"&&roomSnapshot){groupStarted=true;await subscribeRoomRealtime(roomCode,false);launch((roomSnapshot.ids||[]).map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean),{source:"group",group:true});return}
    });
    function renderSearchResults(input){
      const term=input.value.trim().toLocaleLowerCase(),out=document.getElementById("searchResults");if(out&&term){const matches=QUESTIONS.filter(q=>(q.q+" "+q.t).toLocaleLowerCase().includes(term)).slice(0,30);out.innerHTML='<div class="question-list" style="margin-top:10px">'+(matches.length?matches.map(q=>'<div class="question-row"><div><b>#'+q.id+' · '+html(q.t)+'</b><p>'+html(q.q)+'</p></div><button class="btn soft" data-practice="'+q.id+'">Yechish</button></div>').join(""):'<p class="muted">Mos savol topilmadi.</p>')+'</div>'}else if(out)out.innerHTML=""
    }
    document.addEventListener("input",e=>{if(e.target.id==="questionSearch")renderSearchResults(e.target)});
    document.addEventListener("change",e=>{
      if(e.target.id==="uniCount")document.getElementById("uniCustom").classList.toggle("hidden",e.target.value!=="custom");
      if(e.target.id==="uniTimer")document.getElementById("uniCustomTimer").classList.toggle("hidden",e.target.value!=="custom");
      if(e.target.id==="groupCount")document.getElementById("groupCustomCount").classList.toggle("hidden",e.target.value!=="custom");
      if(e.target.id==="immediateSetting"){state.immediate=e.target.checked;save()}
      if(e.target.id==="masteryTarget"){state.masteryTarget=Number(e.target.value);save()}
      if(e.target.matches("[data-match]")&&session){const q=session.items[session.cursor],k=Number(e.target.dataset.match);session.answers[q.id][k]=e.target.value===""?null:Number(e.target.value);const c=document.querySelector("[data-check]");if(c)c.disabled=!isReady(q)||!!session.checked[q.id];if(session.group)queueParticipantWrite()}
      if(e.target.id==="sectionCount")document.getElementById("sectionCustom").classList.toggle("hidden",e.target.value!=="custom");
      if(e.target.id==="sectionTimer")document.getElementById("sectionCustomTimer").classList.toggle("hidden",e.target.value!=="custom");
      if(e.target.id==="importFile"&&e.target.files[0]){const f=e.target.files[0],r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);const incoming=obj.state||obj;if(!incoming.records||!incoming.daily)throw new Error("Progress fayli formati tanilmadi.");if(confirm("Joriy progress import qilinib almashtirilsinmi?")){state=Object.assign({},defaultState,incoming);save();applyTheme();renderHome();notify("Progress import qilindi.")}}catch(err){notify("Import muvaffaqiyatsiz: "+err.message)}};r.onerror=()=>notify("Faylni o‘qib bo‘lmadi.");r.readAsText(f);e.target.value=""}
    });
    document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="nameInput")setName()});
    applyTheme();
    if(!QUESTIONS.length){app.innerHTML='<section class="panel"><h2>Savollar bazasi yuklanmadi</h2><p>questions.js fayli index.html bilan bir papkada ekanini tekshiring.</p></section>'}
    else if(!state.name)showNameModal();else renderHome();
    if(storageError)notify(storageError);
    const config=window.NETQUIZ_SUPABASE_CONFIG;if(config)connectSupabase(config).then(()=>{if(page==="group")renderGroup();autoJoinRoom()}).catch(e=>{if(page==="group")renderGroup();notify("Supabase’ga ulanilmadi: "+e.message)})
  })();
  </script>
</body>
</html>
